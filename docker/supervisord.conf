; BookWriter — in-image process supervision: uvicorn + nginx.
; Both programs log to the container's stdout/stderr so `docker logs` shows
; everything (maxbytes=0 disables supervisor's own rotation, which cannot work
; against a character device).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

; Loopback-bound on purpose: nginx inside this container is the only client.
; No --reload in production.
[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8185
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
