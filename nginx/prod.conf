# BookWriter — in-image server block. Serves the five-entry SPA bundle and
# proxies /api to the loopback-bound uvicorn in the same container.
# Installed as /etc/nginx/conf.d/bookwriter.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8185/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # src/api/sse.ts streams assistant output as SSE: buffering or caching
        # here would turn an incremental stream into one blob at the end.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # The five static entries, mirroring the branch order of the dev-only
    # spaFallback() Vite plugin. All five must be present: a three-entry config
    # silently 404s /work and /read.
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location /login {
        try_files $uri $uri/ /login/index.html;
    }

    location /work {
        try_files $uri $uri/ /work/index.html;
    }

    location /read {
        try_files $uri $uri/ /read/index.html;
    }

    # /assets/... resolves through here off the single root. Do not add
    # per-entry roots — the five entries share one assets/ chunk graph.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
