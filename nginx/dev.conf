# BookWriter — dev-compose front door. Mounted into the nginx service of
# docker-compose.dev.yml as /etc/nginx/conf.d/default.conf.
# Upstreams are the compose service names.

server {
    listen 80;
    server_name _;

    location /api {
        proxy_pass http://backend:8185;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The upgrade headers belong here, on location /: Vite 6 sets no
    # server.hmr.path, so the HMR websocket comes in on the ordinary route.
    location / {
        proxy_pass http://frontend:8194;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
